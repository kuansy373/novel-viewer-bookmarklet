<!-- @template novelWindow -->
<!DOCTYPE html>
<html lang="ja" style="scrollbar-width: thin;">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>小説</title>
  </head>
  <body>
    <div id="novelDisplay"></div>

    <!-- ページ切り替えオーバーレイ -->
    <div id="page-switch-overlay" style="display:none">
      <div class="dialog">
        <div class="input-container">
          <input type="number" min="1" id="page-input">
          <span id="pageLabel">ページ目に移動しますか?</span>
        </div>
        <div class="button-container">
          <button id="yesButton">はい</button>
          <button id="noButton">いいえ</button>
        </div>
      </div>
    </div>

    <!-- 自動スクロール用スライダー -->
    <input type="range" id="scrollSliderRight" class="scroll-slider scroll-slider--right" min="0" max="25" value="0" draggable="false">
    <input type="range" id="scrollSliderLeft" class="scroll-slider scroll-slider--left" min="0" max="25" value="0" draggable="false">

    <!-- Slider Settings -->
    <div id="scrollUI" style="display:none">
      <div class="title"> Slider Settings</div>
      <div id="sUICloseBtn" class="close-btn">✕</div>
      <label><span><input id="scrollRight" class="settingCheckbox" type="checkbox"> Right side</span></label>
      <label><span><input id="scrollLeft" class="settingCheckbox" type="checkbox"> Left side</span></label>
      <label><span>Shadow :  <input id="scrollS" class="settingInputbox" type="number" value="0"> px</span></label>
      <label><span>Opacity :  <input id="scrollO" class="settingInputbox" type="number" min="0" max="100" value="100"> %</span></label>
      <label><span><input id="scrollB" class="settingCheckbox" type="checkbox"> Border</span></label>
      <label><span><input id="scrollC" class="settingCheckbox" type="checkbox"> Color in</span></label>
      <label><span>Position :  <input id="scrollX" class="settingInputbox" type="number" value="30"> px</span></label>
      <label><span>Width :  <input id="scrollW" class="settingInputbox" type="number" value="80"> px</span></label>
      <label><span>Speed scale :  <input id="scrollSpeedScale" class="settingInputbox" type="number" min="0" max="20" step="1" value="10"> (0~20)</span></label>
      <label><span><input id="scrollHide" class="settingCheckbox" type="checkbox"> Show thumb</span></label>
    </div>

    <!-- 開くボタン △ -->
    <div id="sUIOpenBtn" class="open-btn">
      <svg width="14" height="14" viewBox="0 0 24 24">
        <polygon points="12,6.144 20,20 4,20" fill="none" stroke="currentColor" stroke-width="1"/>
      </svg>
    </div>

    <!-- Font Panel（select の option は JS で生成） -->
    <div id="fontPanel">
      <div id="fUICloseBtn" class="close-btn">✕</div>
      <div class="fp-control-area">
        <div class="fp-row row1">
          <div class="fp-font-family-label">Font family:</div>
          <select id="fontSelect"></select>
        </div>
        <div class="fp-row row2">
          <select id="modeSelect"></select>
          <span id="valueLabel"></span>
          <button id="sliderDecrease">◀</button>
          <input id="slider" type="range">
          <button id="sliderIncrease">▶</button>
        </div>
      </div>
    </div>

    <!-- 開くボタン 〇 -->
    <div id="fUIOpenBtn" class="open-btn">
      <svg width="14" height="14" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1"/>
      </svg>
    </div>

    <!-- Pickr（dragHandle のアイコンは JS で挿入） -->
    <div id="pickrContainer">
      <div id="pUICloseBtn" class="close-btn">✕</div>

      <div class="row">
        <div class="label">BG:</div>
        <div id="bgSwatch"></div>
        <button id="bgHexLoad" class="hex-load-btn">⇦</button>
        <input id="bgHex" class="hex-display" value="-">
        <button class="copy-btn" data-target="bgHex">Copy</button>
        <div id="dragHandle" class="hex-load-btn"></div>
      </div>

      <div class="row">
        <div class="label">FG:</div>
        <div id="fgSwatch"></div>
        <button id="fgHexLoad" class="hex-load-btn">⇦</button>
        <input id="fgHex" class="hex-display" value="-">
        <button class="copy-btn" data-target="fgHex">Copy</button>
        <button id="swapColorsBtn" class="switch-bgfg">↕</button>
      </div>

      <div class="row">
        <div class="label label-lock">BG:</div>
        <label id="bgLockLabel">
          <input type="checkbox" id="color-toggle-bg-lock" style="display:none;">
          <span id="bgLockIcon">🔓</span>
        </label>
        <div class="label label-lock">FG:</div>
        <label id="fgLockLabel">
          <input type="checkbox" id="color-toggle-fg-lock" style="display:none;">
          <span id="fgLockIcon">🔓</span>
        </label>
        <div class="btn-wrapper">
          <button id="randomColorBtn">🎨Random</button>
          <div class="click-block"></div>
        </div>
      </div>

      <div class="row contrast-row" style="align-items: center;">
        <strong>Contrast:</strong>
        <span id="contrastRatio" style="width: 51px;">-</span>
        <input
          id="contrastMin"
          class="contrast-display"
          type="number"
          min="1"
          max="21"
          step="0.1"
          value="3"
          title="Minimum contrast ratio"
        >
        <span style="margin: 0;font-size: 10px;font-weight: 500;">～</span>
        <input
          id="contrastMax"
          class="contrast-display"
          type="number"
          min="1"
          max="21"
          step="0.1"
          value="18"
          title="Maximum contrast ratio"
        >
      </div>
    </div>

    <!-- 開くボタン □ -->
    <div id="pUIOpenBtn" class="open-btn">
      <svg width="14" height="14" viewBox="0 0 24 24">
        <rect x="4" y="4" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1"/>
      </svg>
    </div>

    <!-- 開くボタン ☆ -->
    <div id="oUIOpenBtn" class="open-btn">
      <svg width="14" height="14" viewBox="0 0 24 24">
        <polygon points="12,2 15,10 23,10 17,15 19,23 12,18 5,23 7,15 1,10 9,10" fill="none" stroke="currentColor" stroke-width="1"/>
      </svg>
    </div>

    <!-- Apply Style with One Tap -->
    <div id="onetapUI">
      <div class="title">Apply Style with One Tap</div>
      <div id="oUICloseBtn" class="close-btn">✕</div>
      <div class="ui-buttons">
        <div>
          <input id="jsonInput" class="json-input" placeholder="反映するJSONを貼り付け" />
          <span class="label">⇒</span>
          <button id="applyJsonBtn" class="button">APPLY</button>
        </div>
        <div style="margin-bottom:2px;">
          <input id="saveJsonInput" class="json-input" placeholder="保存するJSONを貼り付け" />
          <span class="label">⇒</span>
          <button id="saveJsonBtn" class="button">SAVE</button>
        </div>
        <div style="display:flex; gap:20px; align-items:stretch; height: 243px;">
          <div id="styleRows" class="style-rows"></div>
          <div id="toolbar">
            <button id="initBtn" class="button">INIT</button>
            <button id="moveBtn" class="button">MOVE</button>
            <button id="delBtn" class="button">DEL</button>
            <button id="prevPageBtn" class="button page-btn">◀</button>
            <button id="nextPageBtn" class="button page-btn">▶</button>
          </div>
        </div>
        <div>
          <button id="viewAllJsonBtn" class="button">すべての保存済みJSONを表示</button>
        </div>

        <template id="styleRowTemplate">
          <div class="button-set style-row">
            <span class="label style-index"></span>
            <button class="button" data-action="save">SAVE</button>
            <span class="label">⇒</span>
            <button class="button apply-btn" data-action="apply">APPLY</button>
          </div>
        </template>
        <template id="lastPageBtnsTemplate">
          <button class="button last-page-btn random-apply-btn" data-action="random">Random Apply</button>
          <button class="button last-page-btn copy-all-btn" data-action="copy-all">すべての保存済みJSONをコピー</button>
        </template>
      </div>
    </div>

    <script>{{script}}</script>
  </body>
</html>

<!-- @template saveConfirmOverlay -->
<div class="box">
  <h3 id="title">☆ {{name}} に保存しますか?</h3>
  <div class="top-container">
    <input type="checkbox" id="prettyPrintCheckbox">
    <label for="prettyPrintCheckbox" id="prettyLabel">プリティプリント</label>
    <button id="jsonEditBtn">編集</button>
    <button id="jsonCopyBtn">コピー</button>
  </div>
  <div class="preview-container">
    <textarea id="preview" readonly></textarea>
  </div>
  <div class="bottom-container">
    <button id="cancelBtn">キャンセル</button>
    <button id="saveBtn">保存する</button>
  </div>
</div>
